theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: Xin Lu 的博客
tagline: AI 工程实践与技术思考
description: >-
  记录 AI 工程实践、技术杂记、读书思考和人生感悟。

url: "https://alex-xinlu.github.io"
baseurl: ""
avatar: "/assets/images/avatar.png"

github:
  username: alex-xinlu

social:
  name: Xin Lu
  email: xinlu.nlp@gmail.com
  links:
    - https://github.com/alex-xinlu
    - https://blog.csdn.net/u010280923

toc: true

comments:
  provider: giscus
  giscus:
    repo: alex-xinlu/alex-xinlu.github.io
    repo_id: "R_kgDOSd9XuQ"
    category: "Announcements"
    category_id: "DIC_kwDOSd9Xuc4C9Swo"
    mapping: pathname
    strict: 0
    input_position: top
    lang: zh-CN
    reactions_enabled: 1

paginate: 10

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
