{{- with site.Params.giscus }}
<script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ index . "repo_id" }}"
        data-category="{{ .category }}"
        data-category-id="{{ index . "category_id" }}"
        data-mapping="{{ .mapping | default "pathname" }}"
        data-strict="{{ .strict | default "0" }}"
        data-reactions-enabled="{{ index . "reactions_enabled" | default "1" }}"
        data-emit-metadata="{{ index . "emit_metadata" | default "0" }}"
        data-input-position="{{ index . "input_position" | default "top" }}"
        data-theme="{{ .theme | default "preferred_color_scheme" }}"
        data-lang="{{ .lang | default "zh-CN" }}"
        crossorigin="anonymous"
        async>
</script>
{{- end }}
