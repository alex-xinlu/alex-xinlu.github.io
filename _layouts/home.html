---
layout: default
---

{{ content }}

{% assign posts = site.posts | sort: "date" | reverse %}
{% if posts.size > 0 %}
<h2>最新文章</h2>
<ul>
  {% for post in posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <small>{{ post.date | date: "%Y-%m-%d" }}</small>
  </li>
  {% endfor %}
</ul>
{% endif %}
