---
layout: default
---

<article class="post">
  {% if page.title %}
  <h1>{{ page.title }}</h1>
  {% endif %}

  {% if page.date %}
  <p><small>{{ page.date | date: "%Y-%m-%d" }}</small></p>
  {% endif %}

  {{ content }}

  {% if page.tags and page.tags.size > 0 %}
  <p><small>Tags: {{ page.tags | join: ", " }}</small></p>
  {% endif %}
</article>
